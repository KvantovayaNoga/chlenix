server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip-сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml application/atom+xml image/svg+xml;

    # Кеширование статики (хэши в именах файлов)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Healthcheck для Docker (возвращает 200 без обращения к SPA-бандлу)
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    # Проксирование API на backend
    # resolver + переменная в proxy_pass: nginx переопределяет DNS backend
    # при каждом запросе, поэтому после рестарта контейнера chlenix-backend
    # (новый IP в docker-сети) не возникает 502 Bad Gateway.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:4000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # Понятный ответ вместо «голого» 502, если backend недоступен
        error_page 502 503 504 = @backend_unavailable;
    }

    location @backend_unavailable {
        default_type application/json;
        return 503 '{"error":"Сервер приложений временно недоступен. Повторите попытку через несколько секунд."}';
    }

    # SPA-роутинг: все остальные запросы → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Запрет доступа к служебным файлам
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
