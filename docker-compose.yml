
services:
  # ============================================================
  # PostgreSQL 16 — база данных
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: chlenix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chlenix}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: ${POSTGRES_DB:-chlenix}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chlenix}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chlenix-net

  # ============================================================
  # Backend API — Node.js + Hono + Prisma
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # Зеркало npm и прокси — задаются в .env при проблемах с сетью
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        HTTP_PROXY: ${HTTP_PROXY:-}
    container_name: chlenix-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-chlenix}:${POSTGRES_PASSWORD:-chlenix_secret}@postgres:5432/${POSTGRES_DB:-chlenix}
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env (generate: openssl rand -base64 48)}"
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    networks:
      - chlenix-net

  # ============================================================
  # Frontend — Nginx + статика React
  # ============================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        # Если registry.npmjs.org недоступен с сервера — укажите зеркало в .env:
        #   NPM_REGISTRY=https://registry.npmmirror.com
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        HTTP_PROXY: ${HTTP_PROXY:-}
    container_name: chlenix-frontend
    restart: unless-stopped
    healthcheck:
      # Проверка собственного лёгкого эндпоинта nginx (/health), а не /api —
      # так статус frontend не зависит от состояния backend
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - chlenix-net

volumes:
  postgres_data:
    driver: local

networks:
  chlenix-net:
    driver: bridge
