version: '3.8'

services:
  # ============================================================
  # PostgreSQL 16 — база данных
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: chlenix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chlenix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?В .env не задан POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-chlenix}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chlenix}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chlenix-net

  # ============================================================
  # Backend API — Node.js + Hono + Prisma
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chlenix-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-chlenix}:${POSTGRES_PASSWORD:-chlenix_secret}@postgres:5432/${POSTGRES_DB:-chlenix}
      JWT_SECRET: ${JWT_SECRET:?В .env не задан JWT_SECRET — сгенерируйте: openssl rand -base64 48}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    networks:
      - chlenix-net

  # ============================================================
  # Frontend — Nginx + статика React
  # ============================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost/api}
    container_name: chlenix-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost/api}
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - chlenix-net

volumes:
  postgres_data:
    driver: local

networks:
  chlenix-net:
    driver: bridge
