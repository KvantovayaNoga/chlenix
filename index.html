<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chlenix</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
    </style>
    <!-- Тема применяется до первой отрисовки из кэша localStorage/системных настроек (без «мигания») -->
    <script>
      (function () {
        try {
          var cached = localStorage.getItem('chlenix_theme');
          var isDark =
            cached === 'dark' ||
            ((cached === 'system' || !cached) &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* localStorage недоступен — используем системные настройки */
          try {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
              document.documentElement.classList.add('dark');
            }
          } catch (inner) {
            /* без темы: светлая по умолчанию */
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
